# osv-scanner config — OSV.dev advisories against Cargo.lock + pnpm-lock.yaml.
# Run via `just sec-deps`. Overlaps with `just deny` / `just audit` on purpose:
# different databases catch different CVEs.
#
# Document every ignore with the affected package, the reason, and a removal
# trigger so waivers don't outlive their justification:
#
# [[IgnoredVulns]]
# id = "RUSTSEC-YYYY-NNNN"
# reason = "transitive only, not reachable; remove when <crate> bumps past vX.Y.Z"

# astral-tokio-tar / rustls-pemfile waivers (RUSTSEC-2026-0066 / -0112 / -0113 /
# / -0145 / RUSTSEC-2025-0134) were removed once testcontainers 0.27 pulled
# astral-tokio-tar 0.6.4 (past the fixed 0.6.2) and dropped rustls-pemfile —
# exactly the trigger they cited (deny.toml dropped them first).

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
reason = """
unsafe-libyaml is unmaintained (no fixed release exists). Pulled by
serde_yaml_ng in httpx for YAML config parsing — runtime, but the advisory is
about maintenance status, not an exploitable bug. Remove when httpx migrates
off serde_yaml_ng or a maintained fork ships a fixed release.
"""
