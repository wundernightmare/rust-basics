name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ping, heartbeat, tasks, consumer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: crates/${{ matrix.service }}/Dockerfile
          load: true
          tags: rust-basics-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: rust-basics-${{ matrix.service }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.json

      - name: CVE scan (grype, fail on high)
        uses: anchore/scan-action@64a33b277ea7a1215a3c142735a1091341939ff5 # v4.1.2
        with:
          image: rust-basics-${{ matrix.service }}:ci
          fail-build: true
          severity-cutoff: high
        env:
          GRYPE_CONFIG: .grype.yaml
          # Accept the bundled vuln DB even if older than grype's 5-day default
          # (CI's clock can run ahead of the latest published DB).
          GRYPE_DB_VALIDATE_AGE: "false"

      # Push happens on master / tags — wire to your registry of choice.
      # - name: Login + push
      #   if: github.event_name == 'push'
      #   uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      #   with:
      #     context: .
      #     file: crates/${{ matrix.service }}/Dockerfile
      #     push: true
      #     tags: ghcr.io/wundernightmare/rust-basics-${{ matrix.service }}:latest
