name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ping, heartbeat, tasks, consumer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load locally for scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/${{ matrix.service }}/Dockerfile
          load: true
          tags: rust-basics-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: rust-basics-${{ matrix.service }}:ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.json

      - name: CVE scan (grype, fail on high)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: rust-basics-${{ matrix.service }}:ci
          fail-build: true
          severity-cutoff: high
        env:
          GRYPE_CONFIG: .grype.yaml
          # Accept the bundled vuln DB even if older than grype's 5-day default
          # (CI's clock can run ahead of the latest published DB).
          GRYPE_DB_VALIDATE_AGE: "false"

      # Push happens on master / tags — wire to your registry of choice.
      # - name: Login + push
      #   if: github.event_name == 'push'
      #   uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      #   with:
      #     context: .
      #     file: crates/${{ matrix.service }}/Dockerfile
      #     push: true
      #     tags: ghcr.io/wundernightmare/rust-basics-${{ matrix.service }}:latest
