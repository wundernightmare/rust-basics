name: appsec

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action needs it to scan pull_request events (it lists the PR's commits)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: semgrep ci --config p/owasp-top-ten --config p/rust

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      # google/osv-scanner-action is a reusable workflow, not a step action, so
      # install the pinned scanner binary directly and run it.
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
      - run: osv-scanner scan --config=osv-scanner.toml --recursive .

  # Run cargo-deny on a normal (gnu) runner via install-action rather than the
  # EmbarkStudios container action: that container is musl, so rust-toolchain.toml's
  # `channel = "1.98"` resolves to an uninstalled `1.98-…-musl` toolchain and
  # cargo metadata fails. On the gnu runner rustup auto-installs 1.98.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [crates/ping/Dockerfile, crates/heartbeat/Dockerfile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: error # the action's default ("info") overrides the config; pin it
